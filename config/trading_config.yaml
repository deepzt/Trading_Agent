# Trading System Configuration

market:
  timezone: "Asia/Kolkata"
  open_time: "09:15"
  close_time: "15:30"
  pre_open_start: "09:00"
  pre_open_end: "09:08"
  intraday_exit_time: "15:15"   # Exit intraday before market close
  eod_report_time: "15:45"
  exchange: "NSE"

strategies:
  active:
    - swing          # Always on
    - positional     # Always on
    - intraday       # Only during market hours
    - mean_reversion # Oversold bounce — activates only in VOLATILE regime
    # - options      # Uncomment when F&O data is set up

  intraday:
    enabled: false                  # DISABLED: breakout is computed from daily candles, not
                                    # live intraday bars — re-enable once a true 5/15m loop exists
    timeframe: "15m"
    lookback_days: 5
    breakout_buffer_pct: 0.002      # 0.2% above breakout level
    volume_surge_multiplier: 1.5    # Volume must be 1.5x 20-period avg
    min_price: 100                  # Skip penny stocks
    max_price: 50000
    exit_by: "15:15"
    auto_close_eod: true            # Auto-close open intraday positions at 3:20 PM IST
    max_entry_gap_pct: 0.02         # Skip trade if live price is >2% above planned entry

  swing:
    timeframe: "1d"
    lookback_days: 90
    ema_fast: 9
    ema_slow: 21
    ema_trend: 50
    rsi_min: 40
    rsi_max: 65
    min_adx: 20                     # Trend strength filter
    max_hold_days: 21              # Time-stop: exit if T1 not reached within ~3 weeks

  positional:
    timeframe: "1wk"
    lookback_days: 365
    ema_trend: 200
    rsi_min: 45
    rsi_max: 70
    min_holding_days: 15
    max_hold_days: 84              # Time-stop: exit if T1 not reached within ~12 weeks

  mean_reversion:
    rsi_oversold: 35             # RSI must be below this to qualify
    bb_band_tolerance: 0.005     # Allow up to 0.5% above lower Bollinger Band
    min_rr: 1.0                  # Minimum reward/risk ratio to generate signal
    # Only activates when regime == VOLATILE (gated in signal_agent.py)

  options:
    screener_timeframe: "1d"
    pcr_threshold_bullish: 0.7      # PCR < 0.7 = bearish sentiment → contrarian buy
    pcr_threshold_bearish: 1.3      # PCR > 1.3 = bullish sentiment → contrarian sell
    min_oi_change_pct: 10           # Min OI change to flag a strike

technical:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2
  atr_period: 14
  ema_periods: [9, 21, 50, 200]
  volume_ma_period: 20

signals:
  min_confidence_for_claude: 6.0    # Only send to Claude if rules score >= 6/10
  min_confidence_to_trade: 7.0      # Only paper trade if final score >= 7/10
  max_signals_per_run: 15           # Cap signals generated per scan (raised for Nifty 100 universe)
  cooldown_hours: 4                 # Don't re-signal same stock for 4 hrs

volatility_scaling:
  enabled: true
  baseline_atr_pct: 1.5             # Nifty50 average daily ATR as % of price (~1.5%)
  # Scores scaled by min(baseline / current_atr_pct, 1.0) — never boosts, only penalises high-vol

data:
  primary_source: "yfinance"        # "yfinance" or "jugaad"
  fallback_source: "yfinance"
  cache_ttl_minutes: 15             # Cache live quotes for 15 min
  historical_cache_days: 7          # Refresh historical cache after 7 days

validation:
  provider: "auto"                  # "anthropic", "openai", or "auto" (uses whichever key is available)

claude:
  model: "claude-sonnet-4-6"
  max_tokens: 1024
  temperature: 0                    # Deterministic for trading decisions
  use_prompt_caching: true

openai:
  model: "gpt-4o"
  max_tokens: 1024
  temperature: 0

regime:
  vix_volatile_threshold: 18    # VIX >= 18 → VOLATILE (wider stops, reduced intraday)
  vix_crisis_threshold: 24      # VIX >= 24 → CRISIS (no intraday breakout signals)

rbi_mpc:
  blackout_days_before: 2       # Block swing/positional N trading days before decision
  blackout_days_after: 2        # Block swing/positional N trading days after decision
  # RBI MPC decision dates — update each year (announced at rbi.org.in)
  decision_dates:
    - "2026-02-07"
    - "2026-04-09"
    - "2026-06-06"
    - "2026-08-07"
    - "2026-10-09"
    - "2026-12-04"
